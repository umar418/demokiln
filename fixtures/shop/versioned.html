<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Orders</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1 id="h">Orders</h1><p>Send this week's orders to the warehouse.</p><button id="send" type="button">Send</button><div id="result"></div></main>
<script>
var v = (location.search.match(/v=(\d)/) || [])[1];
if (v === "2") document.getElementById("send").textContent = "Send now";
if (v === "3") document.getElementById("h").textContent = "Orders and returns";
document.getElementById("send").addEventListener("click", function () { document.getElementById("result").textContent = "Sent."; });
</script></body></html>
