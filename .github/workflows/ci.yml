name: CI
on:
  push:
    branches: [main]
  pull_request:
# The workflow only reads the code. It cannot write to the repository or publish anything.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: node dist/cli/index.js --version
      # Install the packaged tool into an empty folder and run it, to catch anything
      # that only works from a development checkout (such as a missing dependency).
      - name: Packaged install works
        shell: bash
        run: |
          npm pack
          mkdir "$RUNNER_TEMP/try" && cp demokiln-*.tgz "$RUNNER_TEMP/try/" && cd "$RUNNER_TEMP/try"
          npm init -y
          npm install ./demokiln-*.tgz playwright
          npx demokiln --version
          npx demokiln init tour.yaml
          npx demokiln doctor
